<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Zelda Retro: Aventura en Yucatán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Contenedor Principal (Simula consola portátil en PC / Pantalla completa en móvil) -->
    <div class="console-shell">
      <!-- Pantalla Superior: El Juego (Estilo Zelda NES) -->
      <div class="screen-viewport">
        <!-- Barra superior limpia y reorganizada -->
        <div class="status-bar">
          <span id="healthDisplay">❤️ ❤️ ❤️ ❤️ ❤️</span>
          <span id="itemDisplay">🥐 0/5 | 🎈 0/10 | 🥤 0/9 | 🧀 0/3</span>
        </div>
        <canvas id="gameCanvas" width="320" height="240"></canvas>

        <!-- Mensajes del juego -->
        <div id="dialogOverlay" class="dialog-box hidden">
          <p id="dialogText">¡Has encontrado un cofre del tesoro!</p>
          <button id="dialogBtn">Aceptar</button>
        </div>
      </div>

      <!-- Pantalla Inferior: Carcasa Estilo Game Boy con Controles e Interfaz -->
      <div class="gameboy-body">
        <!-- Se ha eliminado el brand-tag de aquí -->

        <div class="controls-deck">
          <!-- Cruceta Direccional (D-Pad) - JOYSTICK VIRTUAL -->
          <div class="dpad-wrapper" id="joystickZone">
            <div class="dpad">
              <button class="d-btn d-up" id="btnUp">▲</button>
              <button class="d-btn d-left" id="btnLeft">◀</button>
              <button class="d-btn d-center"></button>
              <button class="d-btn d-right" id="btnRight">▶</button>
              <button class="d-btn d-down" id="btnDown">▼</button>
            </div>
          </div>

          <!-- Botones Select / Start -->
          <div class="center-buttons">
            <div class="pill-btn-group">
              <div class="pill-btn"></div>
              <span class="btn-label">SELECT</span>
            </div>
            <div class="pill-btn-group">
              <div class="pill-btn"></div>
              <span class="btn-label">START</span>
            </div>
          </div>

          <!-- Botones de Acción (A y B) -->
          <div class="action-buttons">
            <div class="action-group">
              <button class="action-btn" id="btnB">B</button>
              <!-- Se ha eliminado el label ESPADA -->
            </div>
            <div class="action-group">
              <button class="action-btn" id="btnA">A</button>
              <!-- Se ha eliminado el label SALTAR -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal de Recuerdo Desbloqueado (Al abrir cofres) -->
    <div id="memoryModal" class="modal hidden">
      <div class="modal-card">
        <span id="memoryBadge" class="modal-badge">* TESORO ENCONTRADO *</span>
        <div class="photo-frame">
          <img id="memoryImg" src="" alt="Recuerdo" />
        </div>
        <h2 id="memoryTitle">Título</h2>
        <p id="memoryMessage">Mensaje...</p>
        <button id="closeModalBtn" class="btn-retro">CONTINUAR</button>
      </div>
    </div>

    <script src="mapdata.js"></script>
    <script src="script.js"></script>
    <!-- Script para el funcionamiento del Joystick táctil -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const zone = document.getElementById("joystickZone");
        if (!zone) return;

        let activeTouchId = null;
        let activeButtons = new Set();

        const btnIds = {
          up: "btnUp",
          down: "btnDown",
          left: "btnLeft",
          right: "btnRight",
        };

        const setButtonState = (btnId, shouldBeActive) => {
          const btn = document.getElementById(btnId);
          if (!btn) return;

          if (shouldBeActive && !activeButtons.has(btnId)) {
            btn.classList.add("active");
            btn.dispatchEvent(new Event("mousedown", { bubbles: true }));
            activeButtons.add(btnId);
          } else if (!shouldBeActive && activeButtons.has(btnId)) {
            btn.classList.remove("active");
            btn.dispatchEvent(new Event("mouseup", { bubbles: true }));
            activeButtons.delete(btnId);
          }
        };

        const releaseAll = () => {
          activeButtons.forEach((btnId) => setButtonState(btnId, false));
        };

        const handleMove = (touch) => {
          const rect = zone.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          const dx = touch.clientX - centerX;
          const dy = touch.clientY - centerY;

          const deadZone = 15;
          if (Math.hypot(dx, dy) < deadZone) {
            releaseAll();
            return;
          }

          let angle = Math.atan2(dy, dx) * (180 / Math.PI);
          if (angle < 0) angle += 360;

          let wantUp = false,
            wantDown = false,
            wantLeft = false,
            wantRight = false;

          if (angle >= 337.5 || angle < 22.5) {
            wantRight = true;
          } else if (angle >= 22.5 && angle < 67.5) {
            wantDown = true;
            wantRight = true;
          } else if (angle >= 67.5 && angle < 112.5) {
            wantDown = true;
          } else if (angle >= 112.5 && angle < 157.5) {
            wantDown = true;
            wantLeft = true;
          } else if (angle >= 157.5 && angle < 202.5) {
            wantLeft = true;
          } else if (angle >= 202.5 && angle < 247.5) {
            wantUp = true;
            wantLeft = true;
          } else if (angle >= 247.5 && angle < 292.5) {
            wantUp = true;
          } else if (angle >= 292.5 && angle < 337.5) {
            wantUp = true;
            wantRight = true;
          }

          setButtonState(btnIds.up, wantUp);
          setButtonState(btnIds.down, wantDown);
          setButtonState(btnIds.left, wantLeft);
          setButtonState(btnIds.right, wantRight);
        };

        zone.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            if (activeTouchId === null) {
              const touch = e.changedTouches[0];
              activeTouchId = touch.identifier;
              handleMove(touch);
            }
          },
          { passive: false },
        );

        zone.addEventListener(
          "touchmove",
          (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
              if (e.changedTouches[i].identifier === activeTouchId) {
                handleMove(e.changedTouches[i]);
                break;
              }
            }
          },
          { passive: false },
        );

        zone.addEventListener("touchend", (e) => {
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === activeTouchId) {
              activeTouchId = null;
              releaseAll();
              break;
            }
          }
        });

        zone.addEventListener("touchcancel", () => {
          activeTouchId = null;
          releaseAll();
        });
      });
    </script>
  </body>
</html>
